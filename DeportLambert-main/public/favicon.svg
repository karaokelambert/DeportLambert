<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A00" />
      <stop offset="50%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#7C2D12" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Fondo Redondeado -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Escudo 3D Interior -->
  <g filter="url(#glow)">
    <path 
      d="M256 56 L432 112 V264 C432 372 256 456 256 456 C256 456 80 372 80 264 V112 Z" 
      fill="url(#shieldGrad)" 
      stroke="#FBBF24" 
      stroke-width="12"
      stroke-linejoin="round"
    />
  </g>

  <!-- Patrón de Balón Deportivo Vectorial -->
  <circle cx="256" cy="240" r="105" stroke="#F59E0B" stroke-width="10" fill="rgba(0,0,0,0.4)" opacity="0.85" />
  <path d="M256 135 V345 M151 240 H361" stroke="#F59E0B" stroke-width="8" opacity="0.6" />
  <path d="M180 165 C220 205 220 275 180 315 M332 165 C292 205 292 275 332 315" stroke="#F59E0B" stroke-width="8" opacity="0.6" />

  <!-- Monograma JL Sports 360 -->
  <text 
    x="256" 
    y="272" 
    text-anchor="middle" 
    dominant-baseline="central" 
    fill="#FFFFFF" 
    font-size="96" 
    font-weight="900" 
    font-family="system-ui, -apple-system, sans-serif"
    letter-spacing="2"
  >
    JL
  </text>
  
  <text 
    x="256" 
    y="390" 
    text-anchor="middle" 
    dominant-baseline="central" 
    fill="#FBBF24" 
    font-size="34" 
    font-weight="900" 
    font-family="system-ui, -apple-system, sans-serif"
    letter-spacing="6"
  >
    360
  </text>
</svg>